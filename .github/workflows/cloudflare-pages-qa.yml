  
name: Cloudflare Pages - QA

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Escolha a operacao"
        required: true
        type: choice
        default: validar
        options:
          - validar
          - publicar-qa

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-qa
  cancel-in-progress: false

jobs:
  validar:
    name: Validar o jogo
    runs-on: ubuntu-latest

    steps:
      - name: Obter arquivos do GitHub
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extrair site.zip com seguranca
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile
          import shutil
          import stat

          arquivo = Path("site.zip")
          destino = Path("dist")

          if not arquivo.is_file():
              raise SystemExit("site.zip nao encontrado")

          destino.mkdir(exist_ok=True)

          with zipfile.ZipFile(arquivo) as zipf:
              itens = zipf.infolist()

              if len(itens) > 5000:
                  raise SystemExit("Excesso de arquivos")

              if sum(i.file_size for i in itens) > 350_000_000:
                  raise SystemExit("ZIP descompactado muito grande")

              for item in itens:
                  nome = item.filename

                  # Arquivo exclusivo do GitHub Pages.
                  # Nao deve ser publicado no Cloudflare.
                  if nome == ".nojekyll" and not item.is_dir():
                      print("Ignorando .nojekyll")
                      continue

                  caminho = PurePosixPath(nome)
                  partes = caminho.parts


                  if (
                      not partes
                      or caminho.is_absolute()
                      or ".." in partes
                      or "\\" in nome
                      or ":" in partes[0]
                  ):
                      raise SystemExit("Caminho inseguro: " + nome)

                  if any(
                      p.startswith(".") and p != ".well-known"
                      for p in partes
                  ):
                      raise SystemExit("Arquivo oculto nao permitido: " + nome)

                  modo = item.external_attr >> 16
                  if stat.S_ISLNK(modo) or item.flag_bits & 1:
                      raise SystemExit("Entrada nao permitida: " + nome)

                  if item.is_dir():
                      continue

                  saida = destino.joinpath(*partes)
                  saida.parent.mkdir(parents=True, exist_ok=True)

                  with zipf.open(item) as src, saida.open("wb") as dst:
                      shutil.copyfileobj(src, dst)

          for caminho in ["index.html", "js", "assets", "_headers"]:
              if not (destino / caminho).exists():
                  raise SystemExit("Recurso obrigatorio ausente: " + caminho)

          print("Estrutura validada")
          PY

      - name: Validar sintaxe JavaScript
        shell: bash
        run: |
          find dist/js -type f -name '*.js' -print0 |
            xargs -0 -r -n1 node --check

      - name: Executar testes existentes
        shell: bash
        run: |
          for teste in \
            dist/tests/scenery_npcs.test.js \
            dist/tests/sidewalk_runners.test.js \
            dist/tests/combat_stamina.test.cjs
          do
            if [ -f "$teste" ]; then
              node --test "$teste"
            fi
          done

      - name: Salvar artefato validado
        uses: actions/upload-artifact@v4
        with:
          name: site-validado
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publicar_qa:
    name: Publicar no Cloudflare QA
    needs: validar

    if: >-
      ${{
        inputs.operation == 'publicar-qa' &&
        github.ref == 'refs/heads/main'
      }}

    runs-on: ubuntu-latest
    environment: cloudflare-qa

    steps:
      - name: Baixar artefato validado
        uses: actions/download-artifact@v4
        with:
          name: site-validado
          path: dist

      - name: Publicar no Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=lula-correndo-democracia-qa --branch=main
